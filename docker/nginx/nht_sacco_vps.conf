# ==============================================================================
# NHT-SMS NGINX REVERSE PROXY CONFIGURATION (BARE-METAL UBUNTU VPS)
# Northern Highways Transporters SACCO Management System
# Install path: /etc/nginx/sites-available/nht_sacco
# Symlink: ln -s /etc/nginx/sites-available/nht_sacco /etc/nginx/sites-enabled/
# ==============================================================================

limit_req_zone $binary_remote_addr zone=nht_vps_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nht_vps_auth:10m rate=5r/s;

upstream nht_gunicorn_socket {
    server unix:/run/nht-sms/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name nht-sms.northernhighways.co.ke sacco.northernhighways.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nht-sms.northernhighways.co.ke sacco.northernhighways.co.ke;

    # SSL certificates from Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/nht-sms.northernhighways.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nht-sms.northernhighways.co.ke/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none';" always;

    client_max_body_size 15M;

    # Static assets
    location /static/ {
        alias /var/www/nht-sms/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Public media
    location /media/ {
        alias /var/www/nht-sms/media/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Block access to private vault
    location ^~ /media/private/ {
        deny all;
        return 403;
    }

    # Authentication rate limiting
    location ~ ^/accounts/(login|otp)/ {
        limit_req zone=nht_vps_auth burst=10 nodelay;
        proxy_pass http://nht_gunicorn_socket;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks
    location ~ ^/health/(live|ready)/ {
        access_log off;
        proxy_pass http://nht_gunicorn_socket;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Main Application
    location / {
        limit_req zone=nht_vps_general burst=30 nodelay;
        proxy_pass http://nht_gunicorn_socket;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
