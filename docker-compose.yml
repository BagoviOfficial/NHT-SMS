# ==============================================================================
# NHT-SMS DOCKER COMPOSE ORCHESTRATION
# Northern Highways Transporters SACCO Management System
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Enterprise Relational Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: nht_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nht_sms_db}
      POSTGRES_USER: ${POSTGRES_USER:-nht_sms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nht_secure_pg_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup_db.sh:/usr/local/bin/backup_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nht_sms_user} -d ${POSTGRES_DB:-nht_sms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nht_internal

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache & Message Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nht_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nht_internal

  # ----------------------------------------------------------------------------
  # NHT-SMS Web Application Server (Django + Gunicorn WSGI)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nht_web
    restart: unless-stopped
    command: ["gunicorn", "-c", "/app/docker/gunicorn.conf.py", "nht_sacco.config.wsgi:application"]
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - public_media_volume:/app/media/public
      - private_media_volume:/app/media/private
      - backup_volume:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nht_internal

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Worker
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nht_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "nht_sacco.config", "worker", "-l", "INFO", "-c", "4"]
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - private_media_volume:/app/media/private
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - nht_internal

  # ----------------------------------------------------------------------------
  # Celery Beat Periodic Task Scheduler
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nht_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "nht_sacco.config", "beat", "-l", "INFO"]
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - nht_internal

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy & SSL Termination
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nht_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nht_sacco.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - static_volume:/var/www/static:ro
      - public_media_volume:/var/www/media:ro
    depends_on:
      - web
    networks:
      - nht_internal

# ------------------------------------------------------------------------------
# Persistent Data Volumes & Isolated Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: nht_postgres_data
  redis_data:
    name: nht_redis_data
  static_volume:
    name: nht_static_volume
  public_media_volume:
    name: nht_public_media_volume
  private_media_volume:
    name: nht_private_media_volume
  backup_volume:
    name: nht_backup_volume

networks:
  nht_internal:
    name: nht_internal_network
    driver: bridge
