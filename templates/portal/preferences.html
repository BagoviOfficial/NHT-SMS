{% extends "portal/base_portal.html" %}

{% block title %}Communication Preferences{% endblock %}

{% block portal_content %}
<div>
    <h2 class="mui-h5">Communication Settings</h2>
    <p class="mui-subtitle">Configure your alert channels and notification categories.</p>
</div>

<div class="mui-card">
    <div class="mui-card-body">
        <form method="post" action="{% url 'portal:preferences' %}" class="mui-stack">
            {% csrf_token %}
            <h3 class="mui-h6">Active Delivery Channels</h3>
            <div class="mui-grid mui-grid-2">
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="sms_enabled" {% if preferences.sms_enabled %}checked{% endif %}>
                    <div>
                        <strong>SMS Messaging (Africa's Talking)</strong>
                        <div class="mui-caption">Direct mobile alerts to {{ member.phone_number }}</div>
                    </div>
                </label>
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="whatsapp_enabled" {% if preferences.whatsapp_enabled %}checked{% endif %}>
                    <div>
                        <strong>WhatsApp Business (Meta Cloud API)</strong>
                        <div class="mui-caption">Instant updates via official WhatsApp messages</div>
                    </div>
                </label>
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="email_enabled" {% if preferences.email_enabled %}checked{% endif %}>
                    <div>
                        <strong>Email Notifications</strong>
                        <div class="mui-caption">Statements, receipts, and letters to {{ member.email }}</div>
                    </div>
                </label>
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="in_app_enabled" {% if preferences.in_app_enabled %}checked{% endif %}>
                    <div>
                        <strong>In-App Notification Centre</strong>
                        <div class="mui-caption">Portal inbox alerts and dashboard notices</div>
                    </div>
                </label>
            </div>

            <h3 class="mui-h6">Category Alerts</h3>
            <div class="mui-grid mui-grid-2">
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="compliance_alerts" {% if preferences.compliance_alerts %}checked{% endif %}>
                    <div>
                        <strong>Regulatory Expiry Reminders</strong>
                        <div class="mui-caption">30, 14, 7, and 0-day permit expiry alerts</div>
                    </div>
                </label>
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="billing_alerts" {% if preferences.billing_alerts %}checked{% endif %}>
                    <div>
                        <strong>Billing &amp; Invoicing Alerts</strong>
                        <div class="mui-caption">Instant notifications when invoices are generated or due</div>
                    </div>
                </label>
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="renewal_alerts" {% if preferences.renewal_alerts %}checked{% endif %}>
                    <div>
                        <strong>Document Renewal Milestones</strong>
                        <div class="mui-caption">Updates on submission, payment, and completion</div>
                    </div>
                </label>
                <label class="mui-card" style="padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center;">
                    <input type="checkbox" name="announcements" {% if preferences.announcements %}checked{% endif %}>
                    <div>
                        <strong>SACCO Announcements &amp; Notices</strong>
                        <div class="mui-caption">Executive communiques and AGM notices</div>
                    </div>
                </label>
            </div>

            <div style="text-align: right;">
                <button type="submit" class="mui-btn mui-btn-secondary">
                    <span class="material-icons-outlined">save</span> Save Preferences
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
