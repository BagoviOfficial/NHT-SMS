{% extends "portal/base_portal.html" %}

{% block title %}Submit Support Ticket{% endblock %}

{% block portal_content %}
<div>
    <a href="{% url 'portal:complaints' %}" class="mui-caption" style="font-weight: 700;">
        <span class="material-icons-outlined" style="font-size: 14px;">arrow_back</span> Back to Tickets
    </a>
    <h2 class="mui-h5">Submit Inquiry or Grievance</h2>
</div>

<div class="mui-card">
    <div class="mui-card-body">
        <form method="post" action="{% url 'portal:complaint_submit' %}" class="mui-stack">
            {% csrf_token %}
            <div class="mui-grid mui-grid-2">
                <div class="mui-field">
                    <label class="mui-label">Category / Ticket Type *</label>
                    <select name="incident_type" class="mui-select" required>
                        {% for val, label in incident_types %}
                            <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Severity Level *</label>
                    <select name="severity" class="mui-select" required>
                        {% for val, label in severities %}
                            <option value="{{ val }}" {% if val == 'MEDIUM' %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Associated Vehicle (Optional)</label>
                    <select name="vehicle_id" class="mui-select">
                        <option value="">-- None / General Matter --</option>
                        {% for v in vehicles %}
                            <option value="{{ v.id }}">{{ v.registration_number }} &bull; {{ v.make }} {{ v.model }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Location / Stage of Occurrence (Optional)</label>
                    <input type="text" name="location" class="mui-input" placeholder="e.g. Isiolo Main Terminus, A2 Highway">
                </div>
            </div>
            <div class="mui-field">
                <label class="mui-label">Ticket Subject / Title *</label>
                <input type="text" name="title" class="mui-input" placeholder="Brief summary of your inquiry or grievance" required>
            </div>
            <div class="mui-field">
                <label class="mui-label">Detailed Description *</label>
                <textarea name="description" class="mui-textarea" rows="4" placeholder="Provide complete details..." required></textarea>
            </div>
            <div class="mui-flex-between">
                <a href="{% url 'portal:complaints' %}" class="mui-btn mui-btn-outlined">Cancel</a>
                <button type="submit" class="mui-btn mui-btn-secondary">
                    <span class="material-icons-outlined">send</span> Submit Ticket
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
