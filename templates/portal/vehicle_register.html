{% extends "portal/base_portal.html" %}

{% block title %}Register New Vehicle{% endblock %}

{% block portal_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <a href="{% url 'portal:vehicles' %}" class="small text-decoration-none mb-1 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Back to Fleet
        </a>
        <h4 class="fw-bold mb-0 text-nht-navy">Register New Fleet Vehicle</h4>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="post" action="{% url 'portal:vehicle_register' %}">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-muted">Registration Plate Number <span class="text-danger">*</span></label>
                    <input type="text" name="registration_number" class="form-control" placeholder="e.g. KDA 123A" required>
                    <div class="form-text">Enter Kenyan registration plate (e.g. KDA 123A).</div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-muted">Vehicle Category <span class="text-danger">*</span></label>
                    <select name="category" class="form-select" required>
                        {% for val, label in categories %}
                            <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-muted">Make <span class="text-danger">*</span></label>
                    <input type="text" name="make" class="form-control" placeholder="e.g. Toyota, Isuzu" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-muted">Model <span class="text-danger">*</span></label>
                    <input type="text" name="model" class="form-control" placeholder="e.g. HiAce, NQR" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold small text-muted">Year of Manufacture <span class="text-danger">*</span></label>
                    <input type="number" name="year_of_manufacture" class="form-control" value="2020" min="1990" max="2030" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold small text-muted">Carrying Capacity (Seats) <span class="text-danger">*</span></label>
                    <input type="number" name="carrying_capacity" class="form-control" value="14" min="1" max="100" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold small text-muted">Fuel Type <span class="text-danger">*</span></label>
                    <select name="fuel_type" class="form-select" required>
                        {% for val, label in fuel_types %}
                            <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-muted">Chassis Number (VIN) <span class="text-danger">*</span></label>
                    <input type="text" name="chassis_number" class="form-control" placeholder="Enter 17-digit Chassis Number" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold small text-muted">Engine Number <span class="text-danger">*</span></label>
                    <input type="text" name="engine_number" class="form-control" placeholder="Enter Engine Serial Number" required>
                </div>

                <div class="col-12 mt-4 text-end">
                    <a href="{% url 'portal:vehicles' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-nht-primary px-4">
                        <i class="bi bi-check2-circle me-1"></i> Submit Vehicle for Onboarding
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
