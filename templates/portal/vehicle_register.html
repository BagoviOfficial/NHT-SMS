{% extends "portal/base_portal.html" %}

{% block title %}Register New Vehicle{% endblock %}

{% block portal_content %}
<div>
    <a href="{% url 'portal:vehicles' %}" class="mui-caption" style="font-weight: 700;">
        <span class="material-icons-outlined" style="font-size: 14px;">arrow_back</span> Back to Fleet
    </a>
    <h2 class="mui-h5">Register New Fleet Vehicle</h2>
</div>

<div class="mui-card">
    <div class="mui-card-body">
        <form method="post" action="{% url 'portal:vehicle_register' %}" class="mui-stack">
            {% csrf_token %}
            <div class="mui-grid mui-grid-2">
                <div class="mui-field">
                    <label class="mui-label">Registration Plate Number *</label>
                    <input type="text" name="registration_number" class="mui-input" placeholder="e.g. KDA 123A" required>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Vehicle Category *</label>
                    <select name="category" class="mui-select" required>
                        {% for val, label in categories %}
                            <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Make *</label>
                    <input type="text" name="make" class="mui-input" placeholder="e.g. Toyota, Isuzu" required>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Model *</label>
                    <input type="text" name="model" class="mui-input" placeholder="e.g. HiAce, NQR" required>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Year of Manufacture *</label>
                    <input type="number" name="year_of_manufacture" class="mui-input" value="2020" min="1990" max="2030" required>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Carrying Capacity (Seats) *</label>
                    <input type="number" name="carrying_capacity" class="mui-input" value="14" min="1" max="100" required>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Fuel Type *</label>
                    <select name="fuel_type" class="mui-select" required>
                        {% for val, label in fuel_types %}
                            <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Chassis Number (VIN) *</label>
                    <input type="text" name="chassis_number" class="mui-input" placeholder="Enter Chassis Number" required>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Engine Number *</label>
                    <input type="text" name="engine_number" class="mui-input" placeholder="Enter Engine Serial Number" required>
                </div>
            </div>
            <div class="mui-flex-between" style="margin-top: 8px;">
                <a href="{% url 'portal:vehicles' %}" class="mui-btn mui-btn-outlined">Cancel</a>
                <button type="submit" class="mui-btn mui-btn-secondary">
                    <span class="material-icons-outlined">check_circle</span> Submit Vehicle for Onboarding
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
