{% extends "portal/base_portal.html" %}

{% block title %}Apply for Document Renewal{% endblock %}

{% block portal_content %}
<div>
    <a href="{% url 'portal:renewals' %}" class="mui-caption" style="font-weight: 700;">
        <span class="material-icons-outlined" style="font-size: 14px;">arrow_back</span> Back to Renewals
    </a>
    <h2 class="mui-h5">Submit Regulatory Document Renewal</h2>
</div>

<div class="mui-card">
    <div class="mui-card-body">
        <form method="post" action="{% url 'portal:renewal_apply' %}" class="mui-stack">
            {% csrf_token %}
            <div class="mui-grid mui-grid-2">
                <div class="mui-field">
                    <label class="mui-label">Select Target Vehicle *</label>
                    <select name="vehicle_id" class="mui-select" required>
                        <option value="">-- Choose Registered Vehicle --</option>
                        {% for v in vehicles %}
                            <option value="{{ v.id }}" {% if request.GET.vehicle_id == v.id|stringformat:"s" %}selected{% endif %}>
                                {{ v.registration_number }} &bull; {{ v.make }} {{ v.model }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mui-field">
                    <label class="mui-label">Select Document Type to Renew *</label>
                    <select name="document_type_id" class="mui-select" required>
                        <option value="">-- Choose Regulatory Permit --</option>
                        {% for dt in document_types %}
                            <option value="{{ dt.id }}">{{ dt.name }} ({{ dt.issuing_authority }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mui-field">
                <label class="mui-label">Additional Notes / Instructions (Optional)</label>
                <textarea name="notes" class="mui-textarea" rows="3" placeholder="Provide any special instructions regarding this renewal application..."></textarea>
            </div>
            <div class="mui-flex-between">
                <a href="{% url 'portal:renewals' %}" class="mui-btn mui-btn-outlined">Cancel</a>
                <button type="submit" class="mui-btn mui-btn-secondary">
                    <span class="material-icons-outlined">autorenew</span> Submit Application
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
